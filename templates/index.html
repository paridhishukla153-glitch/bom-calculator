<!DOCTYPE html>
<html>

<head>

    <title>BOM Calculator</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <h1>BOM Cost Calculator</h1>

    <div class="form-section">

        <label>Select Component:</label>

        <select id="componentSelect">

            {% for component in components %}

            <option
                value="{{ component.unit_price_inr }}"
                data-name="{{ component.name }}">

                {{ component.name }} (₹{{ component.unit_price_inr }})

            </option>

            {% endfor %}

        </select>

        <label>Quantity:</label>

        <input type="number" id="quantity" min="1">

        <button onclick="addToBOM()">Add to BOM</button>

    </div>

    <h2>BOM List</h2>

    <table id="bomTable">

        <tr>
            <th>Component</th>
            <th>Unit Price</th>
            <th>Quantity</th>
            <th>Total</th>
            <th>Action</th>
        </tr>

    </table>

    <h2 id="grandTotal">Grand Total: ₹0</h2>

    <button onclick="generatePDF()">
        Generate PDF Report
    </button>

    <script>

        let grandTotal = 0;

        let bomItems = [];

        function addToBOM() {

            let dropdown = document.getElementById("componentSelect");

            let selectedOption = dropdown.options[dropdown.selectedIndex];

            let componentName = selectedOption.dataset.name;

            let unitPrice = parseFloat(selectedOption.value);

            let quantity = parseInt(document.getElementById("quantity").value);

            if (!quantity || quantity <= 0) {

                alert("Enter valid quantity");

                return;
            }

            let total = unitPrice * quantity;

            grandTotal += total;

            document.getElementById("grandTotal").innerText =
                "Grand Total: ₹" + grandTotal;

            let table = document.getElementById("bomTable");

            let row = table.insertRow();

            row.innerHTML = `
                <td>${componentName}</td>
                <td>₹${unitPrice}</td>
                <td>${quantity}</td>
                <td>₹${total}</td>
                <td>
                    <button onclick="removeRow(this, ${total})">
                        Remove
                    </button>
                </td>
            `;

            bomItems.push({
                name: componentName,
                unit_price: unitPrice,
                quantity: quantity
            });
        }

        function removeRow(button, total) {

            let row = button.parentNode.parentNode;

            row.remove();

            grandTotal -= total;

            document.getElementById("grandTotal").innerText =
                "Grand Total: ₹" + grandTotal;
        }

        async function generatePDF() {

            const response = await fetch("/generate_pdf", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify(bomItems)
            });

            const blob = await response.blob();

            const url = window.URL.createObjectURL(blob);

            const a = document.createElement("a");

            a.href = url;

            a.download = "BOM_Report.pdf";

            a.click();
        }

    </script>

</body>

</html>
